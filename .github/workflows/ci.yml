name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wazn
          POSTGRES_PASSWORD: wazn
          POSTGRES_DB: wazn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wazn -d wazn"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://wazn:wazn@localhost:5432/wazn?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run test:e2e
      - run: npm run build
