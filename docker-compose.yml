name: wazn

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wazn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wazn
      POSTGRES_PASSWORD: wazn
      POSTGRES_DB: wazn
      TZ: UTC
    ports:
      # Host port 5433 so it never clashes with a locally installed Postgres on 5432.
      - '5433:5432'
    volumes:
      - wazn-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wazn -d wazn']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wazn-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - wazn-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends in development. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.30.7
    container_name: wazn-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  wazn-pg:
  wazn-redis:
